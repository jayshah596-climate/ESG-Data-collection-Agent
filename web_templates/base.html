<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ESG Data Collection{% endblock %}</title>
    <style>
        :root {
            --primary: #1a6b3c;
            --primary-light: #e8f5ee;
            --primary-dark: #0d4a28;
            --accent: #2196F3;
            --warning: #ff9800;
            --danger: #f44336;
            --gray-50: #fafafa;
            --gray-100: #f5f5f5;
            --gray-200: #eeeeee;
            --gray-300: #e0e0e0;
            --gray-500: #9e9e9e;
            --gray-700: #616161;
            --gray-900: #212121;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--gray-900);
            background: var(--gray-100);
            line-height: 1.6;
        }

        /* Navigation */
        .navbar {
            background: var(--primary-dark);
            color: white;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            height: 56px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .brand {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-decoration: none;
            color: white;
        }
        .navbar .brand span { color: #81c784; }
        .navbar nav { margin-left: auto; display: flex; gap: 1.5rem; }
        .navbar nav a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .navbar nav a:hover { color: white; }

        /* Layout */
        .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
        .container-wide { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

        /* Cards */
        .card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--primary-light);
            color: var(--primary-dark);
        }

        /* Form elements */
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            color: var(--gray-700);
        }
        .form-group .hint {
            font-size: 0.75rem;
            color: var(--gray-500);
            margin-bottom: 0.3rem;
        }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group input[type="url"],
        .form-group input[type="file"],
        .form-group textarea {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,107,60,0.12);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .unit-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary {
            background: var(--gray-200);
            color: var(--gray-700);
        }
        .btn-secondary:hover { background: var(--gray-300); }
        .btn-lg { padding: 0.8rem 2rem; font-size: 1rem; }

        /* Alerts */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .alert-error { background: #fde8e8; color: #c62828; border-left: 4px solid var(--danger); }
        .alert-success { background: #e8f5ee; color: #1a6b3c; border-left: 4px solid var(--primary); }

        /* Tables */
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.6rem 0.75rem; text-align: left; border-bottom: 1px solid var(--gray-200); }
        th { font-size: 0.8rem; text-transform: uppercase; color: var(--gray-500); font-weight: 600; }
        td { font-size: 0.9rem; }

        /* Confidence badges */
        .badge { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge-high { background: #c6efce; color: #1a6b3c; }
        .badge-medium { background: #ffeb9c; color: #7c6a00; }
        .badge-low { background: #ffc7ce; color: #c62828; }
        .badge-missing { background: var(--gray-200); color: var(--gray-500); }

        /* Progress bar */
        .progress-bar {
            height: 8px;
            background: var(--gray-200);
            border-radius: 4px;
            overflow: hidden;
            margin: 0.5rem 0;
        }
        .progress-bar .fill {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
            transition: width 0.5s;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 4rem 2rem;
        }
        .hero h1 { font-size: 2.2rem; margin-bottom: 0.75rem; color: var(--primary-dark); }
        .hero p { font-size: 1.1rem; color: var(--gray-700); max-width: 600px; margin: 0 auto 2rem; }

        /* Feature grid */
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin: 2rem 0; }
        .feature {
            background: white;
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .feature h3 { margin: 0.75rem 0 0.5rem; color: var(--primary-dark); }
        .feature p { font-size: 0.85rem; color: var(--gray-700); }
        .feature .icon { font-size: 2rem; }

        /* Section toggle */
        .section-toggle {
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-toggle .arrow {
            transition: transform 0.2s;
            font-size: 0.8rem;
            color: var(--gray-500);
        }
        .section-body { padding-top: 1rem; }

        /* Download cards */
        .download-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .download-card {
            background: var(--gray-50);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 1.25rem;
            text-align: center;
            transition: border-color 0.2s;
        }
        .download-card:hover { border-color: var(--primary); }
        .download-card .file-type { font-size: 0.75rem; color: var(--gray-500); text-transform: uppercase; font-weight: 600; }
        .download-card .file-name { font-size: 0.85rem; margin: 0.5rem 0; word-break: break-all; }

        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
            .hero h1 { font-size: 1.6rem; }
            .container { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/" class="brand">ESG <span>DataCollect</span></a>
        <nav>
            <a href="/">Home</a>
            <a href="/collect">New Collection</a>
            <a href="/results">Past Results</a>
        </nav>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="container" style="padding-bottom:0">
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
